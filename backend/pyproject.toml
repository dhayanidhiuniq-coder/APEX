[project]
name = "apex-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1,<2",
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
apex-backend = "apex_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # httpx is a runtime dependency (Supabase token verification) and is listed
    # under [project.dependencies] above, so it is not repeated here.
    "pytest>=9.1.1",
]
